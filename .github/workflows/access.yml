name: Sync web access
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the Cloudflare Access list
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ACCESS_LIST: ${{ secrets.ACCESS_LIST }}
          ACCESS_POLICY_NAME: ${{ vars.ACCESS_POLICY_NAME }}
          ACCESS_APP_DOMAIN: parsa-farsi.pages.dev
          # Last day the site is open to everyone (UTC); after it only ACCESS_LIST gets in.
          ACCESS_OPEN_UNTIL: '2026-11-06'
        run: python3 tools/sync_access.py
