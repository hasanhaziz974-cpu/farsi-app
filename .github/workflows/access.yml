name: Sync web access
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the Cloudflare Access list
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ACCESS_LIST: ${{ secrets.ACCESS_LIST }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          ACCESS_POLICY_NAME: ${{ vars.ACCESS_POLICY_NAME }}
          ACCESS_APP_DOMAIN: parsa-farsi.pages.dev
          # Anyone may sign in and get a 7-day trial (functions/_middleware.js); remove to admit only the list.
          TRIAL_PAGES_PROJECT: parsa-farsi
          # PUBLIC_PATHS: welcome fonts  (off until the Pages deployment serves welcome/ and 404.html)
          # Shown on the sign-in page where visitors type their email.
          LOGIN_HEADER: 'الفارسية من الصفر: لديك أسبوع فترة تجريبية مجانية'
          LOGIN_FOOTER: 'أدخل بريدك ليصلك رمز الدخول. تبدأ فترتك التجريبية (٧ أيام) من أول دخول.'
          LOGIN_FOOTER_SOCIAL: 'ادخل بحساب {options} بضغطة واحدة، أو أدخل بريدك ليصلك رمز الدخول. تبدأ فترتك التجريبية (٧ أيام) من أول دخول.'
        run: python3 tools/sync_access.py
      - name: Check that only the public pages open without signing in
        run: |
          S=https://parsa-farsi.pages.dev
          bad=0
          for p in / /index.html /admin /welcome /welcome/ /welcome/x /fonts/x /fonts/Vazirmatn-Regular.woff2 /store/listing.md /audio/x.mp3; do
            out=$(curl -s -o body.txt -w '%{http_code} %{redirect_url}' "$S$p")
            title=$(grep -o '<title>[^<]*' body.txt | head -1 | sed 's/<title>//')
            echo "$p -> $out ${title:+[$title]}"
            case "$p" in /welcome*|/fonts*) ;; *)
              if [ "${out%% *}" = 200 ]; then echo "::error::$p opens without signing in"; bad=1; fi;; esac
            if grep -q 'id="main"' body.txt && [ "$p" != / ] && [ "$p" != /index.html ]; then echo "::error::$p serves the app"; bad=1; fi
          done
          # A deployment's own address (here the branch alias) must not open the app either.
          P=https://claude-project-files-review-lcyij6.parsa-farsi.pages.dev
          out=$(curl -s -o body.txt -w '%{http_code} %{redirect_url}' "$P/")
          echo "branch address / -> $out"
          if grep -q 'id="main"' body.txt; then echo "::error::the branch address serves the app without signing in"; bad=1; fi
          exit $bad
