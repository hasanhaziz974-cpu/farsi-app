name: Sync web access
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the Cloudflare Access list
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ACCESS_LIST: ${{ vars.ACCESS_LIST }}
          ACCESS_POLICY_NAME: ${{ vars.ACCESS_POLICY_NAME }}
        run: python3 tools/sync_access.py
