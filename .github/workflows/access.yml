name: Sync web access
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the Cloudflare Access list
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ACCESS_LIST: ${{ secrets.ACCESS_LIST }}
          ACCESS_POLICY_NAME: ${{ vars.ACCESS_POLICY_NAME }}
          ACCESS_APP_DOMAIN: parsa-farsi.pages.dev
          # Anyone may sign in and get a 7-day trial (functions/_middleware.js); remove to admit only the list.
          TRIAL_PAGES_PROJECT: parsa-farsi
          # Shown on the sign-in page where visitors type their email.
          LOGIN_HEADER: 'الفارسية من الصفر: لديك أسبوع فترة تجريبية مجانية'
          LOGIN_FOOTER: 'أدخل بريدك ليصلك رمز الدخول. تبدأ فترتك التجريبية (٧ أيام) من أول دخول.'
        run: python3 tools/sync_access.py
