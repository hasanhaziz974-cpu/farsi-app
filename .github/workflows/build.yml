name: Build Android AAB
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KS_B64 }}
      KS_PASS: ${{ secrets.KS_PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Check password secret
        run: |
          if [ -z "$KS_PASS" ]; then echo "::error::Add the repository secret KS_PASS first (a strong password, 10+ characters)"; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Create signing key (first run only)
        if: env.KS_B64 == ''
        run: |
          keytool -genkeypair -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Farsi App, O=Farsi App, C=US"
          base64 -w0 upload.jks > keystore-base64.txt
      - name: Save the key text (download it, then add it as secret KS_B64)
        if: env.KS_B64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: SECRET-signing-key
          path: keystore-base64.txt
          retention-days: 3
      - uses: actions/setup-node@v4
        if: env.KS_B64 != ''
        with:
          node-version: 22
      - name: Build the app
        if: env.KS_B64 != ''
        run: |
          mkdir -p www && cp -r index.html bridge.js fonts www/
          if [ -d audio ]; then cp -r audio www/; else echo "::warning::No audio folder, the app will use device text-to-speech"; fi
          npm ci
          npx cap add android
          mkdir -p assets && cp icon-only.png assets/
          npx capacitor-assets generate --android --iconBackgroundColor '#12807F' --iconBackgroundColorDark '#0B5E5E'
          npx cap sync android
          VERSION_NAME="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle && grep -q "versionName \"$VERSION_NAME\"" android/app/build.gradle || { echo "::error::Could not set the app version in build.gradle"; exit 1; }
          cd android && chmod +x gradlew && ./gradlew bundleRelease assembleRelease
      - name: Sign the bundle
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > upload.jks
          AAB=$(find android -name "*.aab" | head -1)
          cp "$AAB" farsi-app.aab
          jarsigner -keystore upload.jks -storepass "$KS_PASS" -keypass "$KS_PASS" -sigalg SHA256withRSA -digestalg SHA-256 farsi-app.aab upload
      - name: Sign the test APK
        if: env.KS_B64 != ''
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find android -name "*release*.apk" | head -1)
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks upload.jks --ks-key-alias upload --ks-pass env:KS_PASS --key-pass env:KS_PASS --out farsi-app.apk aligned.apk
      - name: Publish the signed file
        if: env.KS_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: farsi-app-aab
          path: farsi-app.aab
      - name: Publish the test APK
        if: env.KS_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: farsi-app-apk
          path: farsi-app.apk
      - name: Put the files in a private draft release
        # Drafts are visible only to people with write access, and the APK downloads as is,
        # with no zip to extract. Only the newest three drafts are kept.
        if: env.KS_B64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" farsi-app.apk farsi-app.aab --draft --target "$GITHUB_SHA" \
            --title "الفارسية من الصفر $VERSION_NAME" --notes "نسخة تجريبية للتثبيت المباشر. ملف farsi-app.apk للهاتف، وfarsi-app.aab لـ Google Play."
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft)] | sort_by(.created_at) | reverse | .[3:] | .[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
