name: Check APK downloads
# Temporary diagnostic: compares the APK download of a build that installs (#7) with one that
# fails to extract on the phone (#10), checking the zip GitHub serves and the APK inside it.
on:
  push:
    branches: [claude/project-files-review-lcyij6]
    paths: [.github/workflows/check-apk.yml]
permissions:
  actions: read
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Inspect the downloads
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for RUN in 41180782796 41215643585; do
            echo "::group::Run $RUN"
            ID=$(gh api "repos/$REPO/actions/runs/$RUN/artifacts" --jq '.artifacts[] | select(.name=="farsi-app-apk") | .id')
            gh api "repos/$REPO/actions/artifacts/$ID/zip" > "$RUN.zip"
            ls -l "$RUN.zip"
            echo "--- zip as downloaded"
            zipinfo -v "$RUN.zip" | grep -E "file system or operating system|version of encoding|minimum software version|compression method|general purpose bit flag|extended local header|compressed size|uncompressed size|file last modified|Zip64|extra field" || true
            unzip -t "$RUN.zip"
            mkdir -p "$RUN" && unzip -o -q "$RUN.zip" -d "$RUN"
            APK="$RUN/farsi-app.apk"
            ls -l "$APK"
            echo "--- apk integrity"
            unzip -tq "$APK"
            "$BT/zipalign" -c -P 16 4 "$APK" && echo "zipalign ok"
            "$BT/apksigner" verify --verbose "$APK" | head -8
            "$BT/aapt2" dump badging "$APK" | grep -E "^package|^application-label|^application-icon|^sdkVersion|^targetSdkVersion|native-code" || true
            echo "--- icon resources"
            unzip -l "$APK" | grep -E "res/.*(ic_launcher|mipmap)" | awk '{print $1, $4}' | sort -k2 | head -60
            unzip -l "$APK" | awk 'NR>3 {print $4}' | sed '/^$/d' | sort > "$RUN.list"
            echo "entries: $(wc -l < "$RUN.list")"
            echo "::endgroup::"
          done
          echo "::group::Entries only in one APK"
          diff 41180782796.list 41215643585.list || true
          echo "::endgroup::"
