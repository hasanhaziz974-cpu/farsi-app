name: Check APK install
# Temporary diagnostic: installs build 7 (works on the owner's phone) on an Android emulator,
# then updates it with build 11 (rejected as "invalid package" on the phone), and launches it.
on:
  push:
    branches: [claude/project-files-review-lcyij6]
    paths: [.github/workflows/check-install.yml]
permissions:
  actions: read
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get the two APKs
        run: |
          for RUN in 41180782796 41218404769; do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" --jq '.artifacts[] | select(.name=="farsi-app-apk") | .id')
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > a.zip && unzip -o -q a.zip && mv farsi-app.apk "$RUN.apk"
          done
          ls -l *.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install on Android 15 and 16 style emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install 41180782796.apk && echo "INSTALL BUILD 7: OK"
            adb shell dumpsys package com.hasan.farsi | grep -m1 versionName
            adb install -r 41218404769.apk && echo "UPDATE TO BUILD 11: OK" || echo "UPDATE TO BUILD 11: FAILED"
            adb shell dumpsys package com.hasan.farsi | grep -m1 versionName
            adb uninstall com.hasan.farsi; adb install 41218404769.apk && echo "FRESH INSTALL BUILD 11: OK" || echo "FRESH INSTALL BUILD 11: FAILED"
            adb shell monkey -p com.hasan.farsi -c android.intent.category.LAUNCHER 1 && sleep 8 && adb shell pidof com.hasan.farsi && echo "LAUNCH: OK" || echo "LAUNCH: FAILED"
            adb logcat -d | grep -iE "PackageManager|InstallPackage|parse|com.hasan.farsi" | tail -40
