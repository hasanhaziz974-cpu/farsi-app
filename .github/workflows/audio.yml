name: Generate audio (Azure)
on:
  workflow_dispatch:
    inputs:
      voice:
        description: Azure voice
        type: choice
        options: [fa-IR-DilaraNeural, fa-IR-FaridNeural]
        default: fa-IR-DilaraNeural
      rate:
        description: Speaking rate (e.g. -10%, 0%, -20%)
        default: '-10%'
      force:
        description: Regenerate all files (needed after changing voice or rate)
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      AZURE_VOICE: ${{ inputs.voice }}
      AZURE_RATE: ${{ inputs.rate }}
      FORCE: ${{ inputs.force && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Azure secrets
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ] || [ -z "$AZURE_SPEECH_REGION" ]; then echo "::error::Add the repository secrets AZURE_SPEECH_KEY and AZURE_SPEECH_REGION first"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate audio files
        run: node tools/gen-audio.js
      - name: Commit audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update audio files (${AZURE_VOICE}, rate ${AZURE_RATE})"
          git push
