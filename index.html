function settingsBox(){return'<div class="det" style="text-align:start"><b>⚙️ الإعدادات</b><div class="btns"><button class="btn alt" onclick="S.sfx=S.sfx===0?1:0;save();render();sfx(\'ok\')">'+(S.sfx===0?'🔇 الأصوات والاهتزاز: متوقفة':'🔊 الأصوات والاهتزاز: تعمل')+'</button></div><div class="btns"><button class="btn alt" onclick="shareProg()">📣 شارك تقدّمك مع أصدقائك</button></div></div>'}
function shareProg(){var l=lvl(S.xp),t='أتعلّم الفارسية مع تطبيق «تعلّم الفارسية للعرب» 🌹\nالمستوى '+(l+1)+' ('+LT[Math.min(l,LT.length-1)]+') · '+cnt(S.srs)+' كلمة · سلسلة '+(S.st||0)+' أيام 🔥\nجرّبه معي!';
try{if(navigator.share){navigator.share({text:t}).catch(function(){});return}if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){toast('نُسخ النص، الصقه حيث تشاء')},function(){toast(t)});return}}catch(e){}toast('انسخ هذا النص: '+t)}
function weekBox(){var dn=dayNo(Date.now()),nm=['ح','ن','ث','ر','خ','ج','س'],xs=[],mx=1,i,tot=0;
for(i=6;i>=0;i--){var v=(S.hist&&S.hist[dn-i])||0;xs.push([dn-i,v]);if(v>mx)mx=v;tot+=v}
return'<div class="det"><b>📈 نشاطك هذا الأسبوع</b><div class="mu">'+tot+' نقطة في ٧ أيام</div><div style="display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:10px">'+xs.map(function(x){var h=Math.max(4,Math.round(x[1]/mx*64));return'<div style="flex:1;text-align:center"><div style="font-size:11px;min-height:16px">'+(x[1]||'')+'</div><div style="height:'+h+'px;background:var(--pr);border-radius:6px;opacity:'+(x[1]?1:.25)+'"></div><div class="mu" style="font-size:11px">'+nm[new Date(x[0]*DAY).getUTCDay()]+'</div></div>'}).join('')+'</div></div>'}
function streakLine(){if(!S.st)return'';var t=ds(Date.now()),y=ds(Date.now()-DAY);
if(S.last===t)return'<div style="margin-bottom:8px;font-weight:600">🔥 سلسلتك '+S.st+' أيام، رائع!</div>';
if(S.last===y)return'<div style="margin-bottom:8px;font-weight:600;color:var(--ac)">⏳ سلسلتك '+S.st+' أيام، أنهِ نشاطاً اليوم لتحافظ عليها!</div>';
return'<div class="mu" style="margin-bottom:8px">💤 انقطعت سلسلتك، ابدأ سلسلة جديدة اليوم.</div>'}
function nextStep(){var sv=S.sv||{},k;for(k in sv)if(/^\d+-\d$/.test(k)){var a=k.split('-');return{l:+a[0],g:+a[1],r:1}}
for(var l=0;l<LES.length;l++){if(!(S.pass&&S.pass[l])){if(unlocked(l)&&allowed('L',l))return{l:l,g:sp(l)};break}}return null}
function goStep(l,g){tab='home';sub=l;startStage(l,g)}
function stepBtn(){if(!S.xp)return'';var n=nextStep();if(!n)return'';return'<button class="btn" style="margin-top:10px;width:100%" onclick="goStep('+n.l+','+n.g+')">'+(n.r?'↻ تابع من حيث توقفت':'▶ تابع')+': '+LES[n.l].t+' · المرحلة '+(n.g+1)+'</button>'}
function dailyCard(){if(!S.xp)return'';if(S.dc===ds(Date.now()))return'<div class="det" style="text-align:start;padding:10px 14px">⚡ تحدّي اليوم ✅ أنجزته! عد غداً لتحدٍّ جديد.</div>';
return'<button class="row" style="border-color:var(--ac)" onclick="startDaily()"><div><div style="font-weight:600">⚡ تحدّي اليوم</div><div class="mu">٦ أسئلة سريعة من كلماتك · +٢٠ نقطة مكافأة</div></div><span class="mu">‹</span></button>'}
function startDaily(){M=null;var pool=ALL.filter(function(w){return unlocked(w.l)&&allowed('L',w.l)}),ln=pool.filter(function(w){return S.srs[w.id]}),src=ln.length>=6?ln:pool,ws=sh(src).slice(0,6),md=['rec','aud','rev'];
Q={l:-1,g:-1,daily:true,i:0,sc:0,n:ws.length,done:false,qs:ws.map(function(w,i){var d=sh(pool.filter(function(x){return x.ar!==w.ar&&x.fa!==w.fa})).slice(0,3);return{w:w,mode:md[i%3],o:sh([w].concat(d)),a:null}})};
tab='home';sub=0;render();if(Q.qs[0].mode==='aud')say(Q.qs[0].w.fa)}

/* progress saved before lesson 9 (prepositions) was inserted: shift lesson indexes >= 8 */
function migrateV2(){var up=function(i){return i>=8?i+1:i},mv=function(o){if(!o)return o;var n={};Object.keys(o).forEach(function(k){n[up(+k)]=o[k]});return n};
S.pass=mv(S.pass);S.sg=mv(S.sg);
if(S.srs){var n={};Object.keys(S.srs).forEach(function(id){var a=id.split('-');n[up(+a[0])+'-'+a[1]]=S.srs[id]});S.srs=n}
if(S.sv){var m={};Object.keys(S.sv).forEach(function(k){var a=/^(\d+)-(\d)$/.exec(k);if(a){if(+a[1]<8)m[k]=S.sv[k]}else m[k]=S.sv[k]});S.sv=m}
if(S.unl){var u={};Object.keys(S.unl).forEach(function(k){var a=/^L(\d+)$/.exec(k);u[a?'L'+up(+a[1]):k]=S.unl[k]});S.unl=u}}
render();
</script>
