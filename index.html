<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 'Vazirmatn',Tahoma,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:0 16px 96px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0 10px}
h1{font-size:22px;font-weight:800;margin:0}
.chips{display:flex;gap:8px}
.chip{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:2px 12px;font-weight:600;font-size:14px}
.chip b{color:var(--ac)}
h2{font-size:18px;margin:18px 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;width:100%;color:inherit;font:inherit;text-align:start}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pr)}
.fa{font-size:30px;font-weight:800;direction:rtl;line-height:1.3}
.mu{color:var(--mu);font-size:14px}

.btn.no{background:var(--no);color:#fff}.btn.ok{background:var(--ok);color:#fff}
.btns{display:flex;gap:10px;margin-top:14px}.btns .btn{flex:1}
.spk{background:none;border:1.5px solid var(--bd);color:var(--pr);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lt{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 0;text-align:center;cursor:pointer;color:var(--tx);font:inherit}
.lt .fa{font-size:30px}.lt .mu{font-size:12px;direction:ltr}
.lt.sel{border-color:var(--pr);background:var(--pr);color:var(--onpr)}.lt.sel .mu{color:inherit}
.det{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;text-align:center}
.card{background:var(--sf);border:2px solid var(--pr);border-radius:150px 150px 22px 22px;padding:48px 20px 24px;text-align:center;margin-top:14px}
.card .fa{font-size:52px}
.tr{font-size:20px;color:var(--pr);direction:ltr;font-weight:600}
.ar{font-size:22px;font-weight:600;margin-top:4px}
.opt{display:block;width:100%;background:var(--sf);border:1.5px solid var(--bd);border-radius:12px;padding:13px;margin-bottom:8px;font:600 17px 'Vazirmatn',Tahoma,sans-serif;color:var(--tx);cursor:pointer}
.opt.good{border-color:var(--ok);background:var(--ok);color:#fff}.opt.bad{border-color:var(--no);background:var(--no);color:#fff}
nav{position:fixed;inset:auto 0 0 0;background:var(--sf);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}

nav button{flex:1;background:none;border:0;padding:12px 0 10px;font:600 13px 'Vazirmatn',Tahoma,sans-serif;color:var(--mu);cursor:pointer;border-top:3px solid transparent}

.det:has(+.opt) .tr{color:#CFF3F1}
.det:has(+.opt) .mu{color:#D5EDEC}
.det:has(+.opt) .spk{background:#ffffff26;border-color:#ffffffaa;color:#fff}
.rowf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ring{width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::before{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--sf)}.ring b{position:relative;font-size:15px}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.bdg>div{border:1px solid var(--bd);border-radius:12px;padding:8px 4px;font-size:12px;line-height:1.4;background:var(--bg)}
.bdg>div.lk{opacity:.45;filter:grayscale(1)}.bdg i{display:block;font-style:normal;font-size:26px}
.cel{position:fixed;left:16px;right:16px;top:calc(16px + env(safe-area-inset-top,0px));max-width:480px;margin:auto;background:linear-gradient(160deg,#12807F,#0B5E5E);color:#fff;border-radius:16px;padding:12px 16px;text-align:center;font-weight:700;line-height:1.8;z-index:30;box-shadow:0 10px 30px #0006;animation:celpop .35s ease}
.cnf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:29}.cnf i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:cnfall linear forwards}
@keyframes cnfall{to{transform:translateY(110vh) rotate(540deg)}}@keyframes celpop{from{transform:translateY(-24px) scale(.94);opacity:0}}
@media (prefers-reduced-motion:reduce){.cel{animation:none}}
.opt.sel{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr) inset}
.fbk{border-radius:14px;padding:12px 14px;margin:6px 0 4px;text-align:center;line-height:1.7;font-weight:600}
.fbk.ok{background:var(--ok);color:#fff}
.fbk.no{background:var(--sf);border:1.5px solid var(--ac);color:var(--tx)}
.srch{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);font:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.big{font-size:40px;font-weight:800;color:var(--pr)}
.chip{display:inline-block;margin-block-start:6px;margin-inline-end:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--pr);background:transparent;color:var(--pr);font:inherit;font-size:14px;cursor:pointer}
.chip.off{border-color:var(--bd);color:var(--mu)}
.links{margin:0 0 12px}
.prow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--bd);padding:10px 2px;margin-top:8px;font:inherit;color:inherit;text-align:start;cursor:pointer}
.prow.dn{opacity:.6}
.pi{width:28px;height:28px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--pr);flex:none}
.spk.star{font-size:17px}
.spk.star.on{border-color:var(--ac)}
.row.lkd{padding:10px 14px;margin-bottom:6px;opacity:.55;font-weight:600;justify-content:flex-start}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.tv{font-size:22px;font-weight:800;color:var(--pr)}
.lnk-no{background:none;border:0;color:var(--no);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:8px}
</style>
</head>

var GR=[
{t:'ترتيب الجملة',s:'الفعل دائماً في آخر الجملة',n:'ترتيب الجملة الفارسية: <b>الفاعل + المفعول + الفعل</b>. الفعل يأتي في النهاية دائماً، بعكس العربية التي يبدأ بها غالباً. تقول حرفياً: «أنا كتاباً أقرأ».',e:[['من کتاب می‌خوانم','man ketāb mikhānam','أنا أقرأ كتاباً'],['او چای می‌نوشد','u chāy minushad','هو يشرب الشاي'],['ما به بازار می‌رویم','mā be bāzār miravim','نحن نذهب إلى السوق']]},
{t:'لا تذكير ولا تأنيث',s:'ولا «ال» التعريف',n:'الفارسية <b>بلا مذكر ومؤنث</b>، والضمير «او» يعني هو وهي معاً. وليس فيها «ال» التعريف، فكلمة «کتاب» تعني كتاب أو الكتاب حسب السياق. وللتنكير يمكن وضع «یک» قبل الاسم.',e:[['او دکتر است','u doktor ast','هو / هي طبيب'],['کتاب خوب است','ketāb khub ast','الكتاب جيد'],['یک کتاب','yek ketāb','كتاب (واحد)']]},
{t:'الجمع',s:'«ها» للجميع و«ان» للأشخاص',n:'أسهل طريقة للجمع إضافة <b>«ها»</b> في آخر الكلمة، وتصلح لكل شيء. وهناك «ان» للأشخاص غالباً. و<b>بعد الأعداد يبقى الاسم مفرداً</b>: «دو کتاب» أي كتابان.',e:[['کتاب‌ها','ketābhā','الكتب'],['دوستان','dustān','الأصدقاء'],['دو کتاب','do ketāb','كتابان']]},
{t:'فعل الكينونة (هستم)',s:'أنا، أنت، هو...',n:'يتصرّف الفعل «هست» بنهايات الضمائر: <b>-am, -i, (ast), -im, -id, -and</b>. وصيغة «هو / هي» تصير «است» وتأتي غالباً في آخر الجملة.',e:[['من دانشجو هستم','man dāneshju hastam','أنا طالب'],['تو خوب هستی','to khub hasti','أنت بخير'],['او خوب است','u khub ast','هو بخير'],['ما خوب هستیم','mā khub hastim','نحن بخير'],['شما خوب هستید','shomā khub hastid','أنتم بخير'],['آنها خوب هستند','ānhā khub hastand','هم بخير']]},
{t:'الإضافة والصفة',s:'صوت e بين الكلمتين',n:'لربط المضاف بالمضاف إليه، أو الاسم بصفته، يُنطق صوت <b>«e»</b> في آخر الكلمة الأولى (ولا يُكتب غالباً). وبعد الحرف الصائت يصير «ye». الترتيب كالعربية: <b>الأول ثم الثاني</b>، والصفة بعد الاسم.',e:[['اسم من','esm-e man','اسمي'],['کتاب علی','ketāb-e Ali','كتاب علي'],['خانه بزرگ','khāne-ye bozorg','بيت كبير']]},
{t:'المضارع',s:'می + الجذر + النهاية',n:'صيغة المضارع: <b>می + جذر الفعل + نهاية الضمير</b> (-am, -i, -ad, -im, -id, -and). مثال بجذر «خور» (أكل): می‌خورم، می‌خوری، می‌خورد، می‌خوریم، می‌خورید، می‌خورند.',e:[['می‌خورم','mikhoram','آكل'],['می‌خوری','mikhori','تأكل'],['می‌خورد','mikhorad','يأكل'],['می‌خوریم','mikhorim','نأكل'],['می‌خواهم','mikhāham','أريد']]},
{t:'الماضي',s:'جذر الماضي + النهاية',n:'الماضي البسيط: <b>جذر الماضي + نهاية الضمير</b>. وجذر الماضي هو المصدر بلا «ن» (رفتن ← رفت). مثال: رفتم، رفتی، رفت، رفتیم، رفتید، رفتند.',e:[['رفتم','raftam','ذهبتُ'],['خوردم','khordam','أكلتُ'],['دیدم','didam','رأيتُ'],['گفتم','goftam','قلتُ'],['دیروز به بازار رفتم','diruz be bāzār raftam','أمس ذهبت إلى السوق']]},
{t:'النفي',s:'أضف «ن» قبل الفعل',n:'للنفي تُضاف <b>«ن»</b> في بداية الفعل: می‌خورم ← نمی‌خورم. وفعل الكينونة: هستم ← <b>نیستم</b>. و«دارم» ← «ندارم».',e:[['نمی‌خورم','nemikhoram','لا آكل'],['نیستم','nistam','لستُ'],['ندارم','nadāram','ليس عندي'],['فارسی بلد نیستم','fārsi balad nistam','لا أتقن الفارسية']]},
{t:'أدوات السؤال',s:'أين، متى، كيف...',n:'ضع أداة السؤال مكان المجهول ولا يتغير ترتيب الجملة. وللأسئلة بنعم أو لا يكفي رفع نبرة الصوت، أو إضافة «آیا» في البداية.',e:[['چه؟','che?','ماذا؟'],['کجا؟','kojā?','أين؟'],['چرا؟','cherā?','لماذا؟'],['چطور؟','chetor?','كيف؟'],['چند؟','chand?','كم؟'],['چه کسی؟','che kasi?','من؟'],['چه وقت؟','che vaght?','متى؟'],['آیا شما عربی هستید؟','āyā shomā arabi hastid?','هل أنت عربي؟']]},
{"t": "حروف الجر", "s": "في، إلى، من، مع... و«را» ليست منها", "n": "الفارسية تضع حرف الجر <b>قبل الاسم</b> مثل العربية، لكن اختيار الحرف يتبع الفعل والمعنى. أهم الفروق: <b>«به»</b> للاتجاه نحو مكان أو شخص (به مدرسه می‌روم)، و<b>«در»</b> للمكان الساكن (در مدرسه هستم). <b>«از»</b> للمنشأ والابتداء (از ایران هستم). <b>«با»</b> للمصاحبة والوسيلة (با دوستم، با اتوبوس). <b>«برای»</b> للغرض والمستفيد. <b>«تا»</b> للنهاية والغاية (از ... تا ...). وانتبه: <b>«را»</b> <b>ليست حرف جر</b>، بل علامة المفعول به المعيّن (کتاب را می‌خوانم).", "e": [["من به مدرسه می‌روم", "man be madrese miravam", "أذهب إلى المدرسة"], ["من در مدرسه هستم", "man dar madrese hastam", "أنا في المدرسة"], ["من از ایران هستم", "man az irān hastam", "أنا من إيران"], ["با دوستم به بازار می‌روم", "bā dustam be bāzār miravam", "أذهب إلى السوق مع صديقي"], ["این هدیه برای شما است", "in hediye barāye shomā ast", "هذه الهدية لكم"], ["از صبح تا شب کار می‌کنم", "az sobh tā shab kār mikonam", "أعمل من الصباح حتى الليل"], ["کتاب روی میز است", "ketāb ru-ye miz ast", "الكتاب على الطاولة"], ["کتاب را می‌خوانم", "ketāb rā mikhānam", "أقرأ الكتاب"]]},
{"t": "المستقبل", "s": "سأذهب: خواهم رفت، أو المضارع مع كلمة زمن", "n": "للمستقبل طريقتان. في الكتابة والأخبار: <b>«خواستن» مصرّفاً + جذر الماضي</b>: خواهم رفت (سأذهب)، خواهی رفت، خواهد رفت، خواهیم رفت، خواهید رفت، خواهند رفت. وفي الكلام اليومي يُستعمل <b>المضارع</b> مع كلمة زمن: فردا می‌روم (أذهب غداً = سأذهب). انتبه: «خواهم» هنا تعني «سـ» وليست «أريد»، فـ«أريد» هي <b>می‌خواهم</b>.", "e": [["فردا به تهران خواهم رفت", "fardā be tehrān khāham raft", "سأذهب غداً إلى طهران"], ["او سال آینده فارسی خواهد خواند", "u sāl-e āyande fārsi khāhad khānd", "سيدرس الفارسية في السنة القادمة"], ["ما شما را خواهیم دید", "mā shomā rā khāhim did", "سنراكم"], ["فردا به تهران می‌روم", "fardā be tehrān miravam", "سأذهب غداً إلى طهران (في الكلام اليومي)"], ["هفته‌ی بعد برمی‌گردم", "hafte-ye baʿd barmigardam", "سأعود الأسبوع القادم"], ["فردا باران خواهد آمد", "fardā bārān khāhad āmad", "سيهطل المطر غداً"]]},
{"t": "الأمر والنهي", "s": "اذهب: برو · لا تذهب: نرو", "n": "الأمر = <b>«بـ» + جذر المضارع</b>: رفتن ← برو (اذهب)، خوردن ← بخور (كُل)، نشستن ← بنشین (اجلس). للجمع والاحترام أضف <b>«ید»</b>: بروید، بنشینید. في الأفعال المركبة (مع کردن وشدن...) لا تُضاف «بـ» غالباً: صحبت کنید (تكلّموا). والنهي: ضع <b>«نـ»</b> مكان «بـ»: نرو (لا تذهب)، نترسید (لا تخافوا). ومن الشواذ: آمدن ← <b>بیا</b> (تعال).", "e": [["لطفاً بنشینید", "lotfan beneshinid", "اجلس من فضلك"], ["اینجا بیا", "injā biyā", "تعال إلى هنا"], ["غذایت را بخور", "ghazāyat rā bokhor", "كُل طعامك"], ["لطفاً آهسته صحبت کنید", "lotfan āheste sohbat konid", "من فضلك تكلّم ببطء"], ["نترس", "natars", "لا تخف"], ["اینجا سیگار نکشید", "injā sigār nakeshid", "لا تدخّنوا هنا"]]},
{"t": "المقارنة والتفضيل", "s": "أكبر: بزرگ‌تر · الأكبر: بزرگ‌ترین", "n": "للمقارنة أضف <b>«تر»</b> إلى الصفة: بزرگ ← بزرگ‌تر (أكبر)، و«من» المقارنة هي <b>«از»</b>: تهران از شیراز بزرگ‌تر است. وللتفضيل أضف <b>«ترین»</b> وضع الصفة <b>قبل</b> الاسم، عكس الصفة العادية، وبلا كسرة: بزرگ‌ترین شهر (أكبر مدينة). وانتبه: خوب ← <b>بهتر</b> (أفضل)، <b>بهترین</b> (الأفضل).", "e": [["تهران از شیراز بزرگ‌تر است", "tehrān az shirāz bozorg-tar ast", "طهران أكبر من شيراز"], ["این کتاب ارزان‌تر است", "in ketāb arzān-tar ast", "هذا الكتاب أرخص"], ["برادرم از من بلندتر است", "barādaram az man boland-tar ast", "أخي أطول مني"], ["این بهترین رستوران شهر است", "in behtarin resturān-e shahr ast", "هذا أفضل مطعم في المدينة"], ["زیباترین شهر ایران کجاست؟", "zibā-tarin shahr-e irān kojāst?", "ما أجمل مدينة في إيران؟"], ["امروز هوا از دیروز گرم‌تر است", "emruz havā az diruz garm-tar ast", "الجو اليوم أحرّ من أمس"]]},

var VOC=null,DTOK=null;

// Daily plan: three steps picked once a day from different sections, so each day reviews, moves the

function planDone(x){var p=S.plan||{};switch(x.t){case'mi':return(p.mi||0)>=x.n;case'sy':return!!(S.story&&S.story[x.i]);case'cs':return!!(S.colp&&S.colp[x.s==='col'?x.i:x.s+x.i]);case'rv':return(p.rv||0)>=x.n;case'dc':return S.dc===ds(Date.now());case'st':return sp(x.l)>x.g;case'd':return!!(S.dp&&S.dp[x.i]);case'g':return!!(S.gp&&S.gp[x.i]);case'rd':return!!(S.rd&&S.rd[x.i]);case'rp':return!!(S.rpd&&S.rpd[x.i]);case'tr':return tripDone(x.i)}return false}
function planApply(cur,it){var c=[],i,ls=cur===null?[]:[cur];if(cur>0)ls.push(cur-1);
ls.forEach(function(l){LINK[l][1].forEach(function(d){c.push({t:'d',i:d,l:l})});c.push({t:'g',i:lg(l)[0],l:l})});
for(i=0;i<DLG.length;i++)c.push({t:'d',i:i});for(i=0;i<GR.length;i++)c.push({t:'g',i:i});
for(i=0;i<DLG.length;i++)if(S.dp&&S.dp[i]){c.push({t:'rd',i:i});c.push({t:'rp',i:i})}
for(i=0;i<c.length;i++){var x=c[i];if(it.some(function(y){return y.t===x.t&&y.i===x.i}))continue;if(planDone(x))continue;if(x.t==='d'&&!dOpen(x.i))continue;if(x.t==='g'&&!gOpen(x.i))continue;if((x.t==='rd'||x.t==='rp')&&!allowed('D',x.i))continue;return x}return null}

var SYNC={on:false,busy:false,dirty:false,last:0,ver:0,timer:null,quiet:false},SYNC_GAP=15*60e3,DEVF=['rem','remDay','remAsk','free','tri','sfx','sv','plan','prem','syncT'];

function syncNow(first){if(!SYNC.on||SYNC.busy||!navigator.onLine)return;SYNC.busy=true;var v=SYNC.ver,before=S.xp;
fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:syncData()}),credentials:'same-origin'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(res){SYNC.busy=false;SYNC.last=Date.now();if(SYNC.ver!==v){syncSoon();return}SYNC.dirty=false;if(res&&res.data)syncAdopt(res.data,first&&(res.data.xp||0)>before)}).catch(function(){SYNC.busy=false;if(SYNC.dirty)syncSoon()})}
function syncAdopt(d,restored){if(JSON.stringify(d)===JSON.stringify(syncData()))return;var keep={};DEVF.forEach(function(k){if(S[k]!==undefined)keep[k]=S[k]});S=d;for(var k in keep)S[k]=keep[k];S.srs=S.srs||{};S.xp=S.xp||0;S.st=S.st||0;S.last=S.last||'';
SYNC.quiet=true;save();SYNC.quiet=false;try{top_();render()}catch(e){}if(restored)setTimeout(function(){celebrate(['☁️ استعدنا تقدّمك المحفوظ مع بريدك','⭐ '+cw(S.xp,'نقاط','نقطة')+' · 📚 '+cw(cnt(S.srs),'كلمات','كلمة')])},600)}

{e:"🌹",t:"في شيراز",d:"سافرت إلى شيراز، وأنت الآن في حديقة ضريح حافظ. رجل لطيف يجلس بجانبك.",who:"رجل شيرازي",req:14,tasks:["سلّم عليه وقل إنك وصلت إلى شيراز للتو", "قل إن المكان جميل", "اسأل عن مكان جيد للأكل", "اشكره وودّعه"],say:[[["سلام، این اولین بار است که به شیراز می‌آیم.", "مرحباً، هذه أول مرة آتي فيها إلى شيراز"], ["سلام آقا، من تازه به شیراز آمده‌ام.", "مرحباً يا سيد، وصلت إلى شيراز للتو"]], [["اینجا خیلی زیباست!", "هذا المكان جميل جداً!"], ["باغ حافظ خیلی قشنگ است.", "حديقة حافظ جميلة جداً"]], [["یک رستوران خوب می‌شناسید؟", "هل تعرف مطعماً جيداً؟"], ["کجا غذای خوب پیدا می‌شود؟", "أين يوجد طعام جيد؟"]], [["خیلی ممنون، خداحافظ!", "شكراً جزيلاً، مع السلامة!"], ["از آشنایی با شما خوشحال شدم.", "سعدت بالتعرّف عليك"]]],ln:[["سلام جوان! به شیراز خوش آمدی.", "salām javān! be shirāz khosh āmadi.", "مرحباً يا شاب! أهلاً بك في شيراز."], ["چه خوب! شیراز شهر شعر و گل است. اینجا آرامگاه حافظ است.", "che khub! shirāz shahr-e sheʿr va gol ast. injā ārāmgāh-e hāfez ast.", "رائع! شيراز مدينة الشعر والورد. هنا ضريح حافظ."], ["بله، مخصوصاً در بهار. مردم اینجا شعر حافظ را خیلی دوست دارند.", "bale, makhsusan dar bahār. mardom-e injā sheʿr-e hāfez rā kheyli dust dārand.", "نعم، خصوصاً في الربيع. الناس هنا يحبون شعر حافظ كثيراً."], ["حتماً! نزدیک اینجا یک رستوران سنتی هست. کباب و فالوده‌ی شیرازی‌اش عالی است.", "hatman! nazdik-e injā yek resturān-e sonnati hast. kabāb va fālude-ye shirāzi-ash ʿāli ast.", "بالتأكيد! قرب هنا مطعم تقليدي. الكباب والفالوذج الشيرازي فيه رائعان."], ["خواهش می‌کنم. سفر خوبی داشته باش!", "khāhesh mikonam. safar-e khubi dāshte bāsh!", "عفواً. رحلة سعيدة!"]]},
{e:"🌸",t:"نوروز مع عائلة پارسا",d:"جاء نوروز، رأس السنة الإيرانية، ودعاك پارسا إلى بيت عائلته لتحتفل معهم.",who:"پارسا",req:3,tasks:["هنّئه بالعيد", "اسأل عن مائدة «هفت سين»", "قل كيف تحتفلون بالعيد في بلدك", "تمنَّ له سنة سعيدة"],say:[[["نوروز مبارک!", "نوروز مبارك!"], ["عید شما مبارک!", "عيدكم مبارك!"]], [["این سفره‌ی هفت‌سین است؟", "هل هذه مائدة «هفت سين»؟"], ["این‌ها چه هستند؟", "ما هذه الأشياء؟"]], [["ما در عراق عید را با خانواده جشن می‌گیریم.", "نحن في العراق نحتفل بالعيد مع العائلة"], ["در کشور ما هم مردم به دیدن هم می‌روند.", "في بلدنا أيضاً يزور الناس بعضهم بعضاً"]], [["سال نو مبارک! سال خوبی داشته باشید.", "سنة جديدة مباركة! أتمنى لكم سنة طيبة"], ["امیدوارم سال خوبی داشته باشی.", "أتمنى أن تكون سنتك طيبة"]]],ln:[["سلام! خوش آمدی. امروز اول فروردین است، روز اول سال نو!", "salām! khosh āmadi. emruz avval-e farvardin ast, ruz-e avval-e sāl-e no!", "مرحباً! أهلاً بك. اليوم أول «فروردين»، أول يوم في السنة الجديدة!"], ["عید تو هم مبارک! بیا، این سفره‌ی عید ماست.", "eyd-e to ham mobārak! biyā, in sofre-ye eyd-e māst.", "وعيدك مبارك أيضاً! تعال، هذه مائدة عيدنا."], ["بله! هفت چیز روی آن است که با حرف «س» شروع می‌شوند، مثل سیب و سبزه. در کشور شما عید را چطور جشن می‌گیرید؟", "bale! haft chiz ru-ye ān ast ke bā harf-e «sin» shoruʿ mishavand, mesl-e sib va sabze. dar keshvar-e shomā eyd rā chetor jashn migirid?", "نعم! عليها سبعة أشياء تبدأ بحرف «س»، مثل التفاح والنبات الأخضر. كيف تحتفلون بالعيد في بلدكم؟"], ["چه جالب! عیدها همه‌جا شبیه هم هستند: خانواده و شادی.", "che jāleb! eyd-hā hame-jā shabih-e ham hastand: khānevāde va shādi.", "ما أجمل هذا! الأعياد متشابهة في كل مكان: العائلة والفرح."], ["ممنون دوست من! سال نوی تو هم مبارک. بیا، این کتاب شعر حافظ عیدی توست.", "mamnun dust-e man! sāl-e no-ye to ham mobārak. biyā, in ketāb-e sheʿr-e hāfez eydi-ye tost.", "شكراً يا صديقي! وسنتك الجديدة مباركة أيضاً. تفضّل، كتاب شعر حافظ هذا عيديّتك."]]},

return'<div class="det"><b>📈 نشاطك هذا الأسبوع</b><div class="mu">'+cw(tot,'نقاط','نقطة')+' في 7 أيام</div><div style="display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:10px">'+xs.map(function(x){var h=Math.max(4,Math.round(x[1]/mx*64));return'<div style="flex:1;text-align:center"><div style="font-size:11px;min-height:16px">'+(x[1]||'')+'</div><div style="height:'+h+'px;background:var(--pr);border-radius:6px;opacity:'+(x[1]?1:.25)+'"></div><div class="mu" style="font-size:11px">'+nm[new Date(x[0]*DAY).getUTCDay()]+'</div></div>'}).join('')+'</div></div>'}
function streakLine(){if(!S.st)return'';var t=ds(Date.now()),y=ds(Date.now()-DAY);
if(S.last===t)return'<div style="margin-bottom:8px;font-weight:600">🔥 سلسلتك '+cw(S.st,'أيام','يوماً','يومان')+'، رائع!</div>';
if(S.last===y)return'<div style="margin-bottom:8px;font-weight:600;color:var(--ac)">⏳ سلسلتك '+cw(S.st,'أيام','يوماً','يومان')+'، أنهِ نشاطاً اليوم لتحافظ عليها!</div>';
return'<div class="mu" style="margin-bottom:8px">💤 انقطعت سلسلتك، ابدأ سلسلة جديدة اليوم.</div>'}
function nextStep(){var sv=S.sv||{},k;for(k in sv)if(/^\d+-\d$/.test(k)){var a=k.split('-');return{l:+a[0],g:+a[1],r:1}}
for(var l=0;l<LES.length;l++){if(!(S.pass&&S.pass[l])){if(unlocked(l)&&allowed('L',l))return{l:l,g:sp(l)};break}}return null}
function goStep(l,g){tab='home';sub=l;startStage(l,g)}
function startDaily(){M=null;var pool=ALL.filter(function(w){return unlocked(w.l)&&allowed('L',w.l)}),ln=pool.filter(function(w){return S.srs[w.id]}),src=ln.length>=6?ln:pool,ws=sh(src).slice(0,6),md=['rec','aud','rev'];
Q={l:-1,g:-1,daily:true,i:0,sc:0,n:ws.length,done:false,qs:ws.map(function(w,i){var d=sh(pool.filter(function(x){return x.ar!==w.ar&&x.fa!==w.fa})).slice(0,3);return{w:w,mode:md[i%3],o:sh([w].concat(d)),a:null}})};
tab='home';sub=0;render();if(Q.qs[0].mode==='aud')say(Q.qs[0].w.fa)}

/* progress saved before lesson 9 (prepositions) was inserted: shift lesson indexes >= 8 */
function migrateV2(){var up=function(i){return i>=8?i+1:i},mv=function(o){if(!o)return o;var n={};Object.keys(o).forEach(function(k){n[up(+k)]=o[k]});return n};
S.pass=mv(S.pass);S.sg=mv(S.sg);
if(S.srs){var n={};Object.keys(S.srs).forEach(function(id){var a=id.split('-');n[up(+a[0])+'-'+a[1]]=S.srs[id]});S.srs=n}
if(S.sv){var m={};Object.keys(S.sv).forEach(function(k){var a=/^(\d+)-(\d)$/.exec(k);if(a){if(+a[1]<8)m[k]=S.sv[k]}else m[k]=S.sv[k]});S.sv=m}
if(S.unl){var u={};Object.keys(S.unl).forEach(function(k){var a=/^L(\d+)$/.exec(k);u[a?'L'+up(+a[1]):k]=S.unl[k]});S.unl=u}}
if(!S.cov){S.cov={};covNew()}snapTake();
render();meLoad();openInit();
</script>
